name: Check for new PRIN sectors

# Every 6 hours: download what the MUR has published, and if a sector is new (or its
# decree changed) regenerate all data, figures and the report and open a pull request
# with the result. Nothing is committed to the default branch. Once all the sectors are
# parsed the workflow disables itself. The GSD of the unit leaders is looked up by name in the
# MUR staff directory (gsd.py); the answers are kept in the Actions cache between runs, so a
# run asks only about leaders it has not seen. The first run starts from the repository secret
# GSD_CACHE (the gzipped, base64 cache), if set, and asks about all of them otherwise.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the Python dependencies
        run: pip install -r requirements.txt

      - name: Download and parse the published PDFs
        run: python3 prin_extract.py --csv

      - name: Detect new publications
        id: changes
        run: |
          n=$(git status --porcelain -- prin_out/decrees.json prin_pdfs | wc -l)
          echo "changed=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          git show HEAD:prin_out/decrees.json > /tmp/decrees_old.json 2>/dev/null || echo '{}' > /tmp/decrees_old.json

      - name: Install LaTeX
        if: steps.changes.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended cm-super dvipng

      - name: Restore the GSD lookups of earlier runs
        if: steps.changes.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: cache
          key: gsd-lookup-${{ github.run_id }}
          restore-keys: gsd-lookup-

      - name: Seed the GSD lookups from the repository secret
        if: steps.changes.outputs.changed == 'true' && hashFiles('cache/gsd_lookup.csv') == ''
        env:
          GSD_CACHE: ${{ secrets.GSD_CACHE }}
        run: |
          if [ -n "$GSD_CACHE" ]; then
            mkdir -p cache
            echo "$GSD_CACHE" | base64 -d | gunzip > cache/gsd_lookup.csv
          fi

      - name: Look up the GSD of the new unit leaders
        id: gsd
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        timeout-minutes: 120
        run: python3 gsd.py

      - name: Tests
        id: tests
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: python3 -m pytest tests -q

      - name: Analysis and report
        id: analysis
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 analysis.py 2>&1 | tee analysis.log
          python3 report.py

      - name: Write the pull request text
        if: steps.changes.outputs.changed == 'true'
        run: |
          python3 - <<'PY' > pr_body.md
          import json
          import decrees
          old = json.load(open("/tmp/decrees_old.json")) or None
          new = json.load(open("prin_out/decrees.json"))
          print("Sectors published since the last update:\n")
          print(decrees.describe_changes(old, new))
          print("\nTests: ${{ steps.tests.outcome }}. GSD lookup: ${{ steps.gsd.outcome }}. Analysis and report: ${{ steps.analysis.outcome }}.")
          names = [l for l in open("analysis.log") if "given names" in l or "institution added" in l]
          if names:
              print("\n**Added to the hand-checked tables, to review on this branch** (given names by the ending rule, an empty "
                    "gender needs F or M; institutions by keywords and an OpenStreetMap search):\n```\n" + "".join(names) + "```")
          print("If a step failed, open its log: a parsed count that differs from the PDF means the layout changed.")
          PY

      - name: Open the pull request
        id: cpr
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: data/update
          title: "New PRIN 2026 sectors"
          commit-message: "Update the data with the newly published PRIN 2026 sectors"
          body-path: pr_body.md
          add-paths: |
            prin_pdfs
            prin_out
            data/given_names.csv
            data/institutions.csv
            report/report.tex
            report/report.pdf
            README.md

      - name: Check whether all the sectors are parsed
        id: complete
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pandas as pd
          import decrees
          done = set(pd.read_csv("prin_out/all_rows.csv")["sector"]) >= set(decrees.ALL_SECTORS)
          print("all=" + str(done).lower())
          PY

      - name: Notify, all the sectors are parsed
        if: steps.complete.outputs.all == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          gh issue create \
            --title "All PRIN 2026 sectors are published and parsed" \
            --body "@${{ github.repository_owner }} all 28 sectors are parsed. Pull request with the final data, figures and report: ${PR_URL:-none, the data were already up to date}. The workflow has disabled itself."

      - name: Stop the workflow, all the sectors are parsed
        if: steps.complete.outputs.all == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable check-new-sectors.yml
